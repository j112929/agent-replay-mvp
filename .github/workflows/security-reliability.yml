name: Agent security and release gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -p 'test_security*.py' -v
      - run: agent-replay security-demo --directory .replay/security-demo
      - name: Verify production gate blocks the synthetic critical regression
        shell: bash
        run: |
          printf '%s\n' '{"environment":"PRODUCTION","min_tasks":20}' > .replay/release-policy.json
          set +e
          agent-replay benchmark gate --baseline .replay/security-demo/baseline --candidate .replay/security-demo/candidate --policy .replay/release-policy.json --output .replay/security-demo/release-gate.json --json
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reliability-evidence
          path: .replay/security-demo/
          retention-days: 14
