name: World model and self-correction
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest tests.test_world_model tests.test_v05_planning -v
      - run: agent-replay planning benchmark --output .replay/world-model-ci --tasks 20
      - run: python scripts/check_world_model_demo.py .replay/world-model-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-model-evidence
          path: .replay/world-model-ci/
  hf-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[world-model]'
      - run: python tests/world_model_hf_smoke.py
