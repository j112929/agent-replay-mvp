name: Self-service accounts, billing and product UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  self-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npm run test:saas
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-product-ui
          path: .replay/ui-results
          retention-days: 3
