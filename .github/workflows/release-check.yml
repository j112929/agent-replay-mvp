name: Distribution integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python scripts/package_release.py --check
      - run: python -m build --wheel --outdir /tmp/replay-wheel
      - run: python -m venv /tmp/replay-smoke
      - run: /tmp/replay-smoke/bin/pip install /tmp/replay-wheel/*.whl
      - run: cd /tmp && /tmp/replay-smoke/bin/agent-replay demo --directory /tmp/wheel-story
      - run: python plugins/agent-replay/scripts/replay.py demo --directory /tmp/plugin-story
      - run: cd /tmp && /tmp/replay-smoke/bin/agent-replay rollout demo --actors 2 --rounds 2 --batch-size 16 --directory /tmp/wheel-rollout
      - run: python plugins/agent-replay/scripts/replay.py rollout demo --actors 2 --rounds 2 --batch-size 16 --directory /tmp/plugin-rollout
