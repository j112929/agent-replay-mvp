name: Rollout learning acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: agent-replay rollout demo --actors 3 --rounds 4 --batch-size 32 --directory .replay/rollout-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-learning-evidence
          path: .replay/rollout-ci/*.json
          include-hidden-files: true
