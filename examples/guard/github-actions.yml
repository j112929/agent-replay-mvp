# Copy into YOUR repository after exporting approved case versions and traces.
# Candidate capture runs in customer-owned CI; never run untrusted fork code with secrets.
name: Agent regression quality gate
on: [pull_request]
permissions:
  contents: read
jobs:
  agent-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./vendor/agent-replay-mvp
      # Your trusted capture step writes sanitized evidence and a trace ID.
      # Existing approved artifacts are kept in tests/guard-project.
      # These IDs are examples: replace with your actual case and capture IDs.
      - name: Approved regression gate
        run: >-
          agent-replay guard run CASE_UUID
          --directory tests/guard-project
          --baseline BASELINE_TRACE_ID --candidate CANDIDATE_TRACE_ID
          --output .replay/guard-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-report
          path: .replay/guard-gate.json
          retention-days: 7
# Configure agent-quality as a required repository check. FAIL exits 1;
# missing evidence/approval exits 3 and also fails the required job.
# Do not upload real production evidence to public artifacts/logs.
