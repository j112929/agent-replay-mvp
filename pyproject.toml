[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay-debugger"
version = "0.2.0"
description = "Production failures to controlled replay, structural diff, and regression CI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.setuptools.package-data]
agent_replay = ["web/*", "schemas/*"]

[project.optional-dependencies]
dev = ["build>=1.2", "jsonschema>=4.23"]
