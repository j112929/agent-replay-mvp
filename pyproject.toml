[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay-debugger"
version = "0.1.0"
description = "Local-first agent trajectory capture and failure replay"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.setuptools.package-data]
agent_replay = ["web/*"]
