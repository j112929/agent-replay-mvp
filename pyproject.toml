[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay-debugger"
version = "0.6.0"
description = "Privacy-safe agent benchmark evaluation, recorded replay, regression and release gates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.setuptools.package-data]
agent_replay = ["web/*", "schemas/*"]

[project.optional-dependencies]
dev = ["build>=1.2", "jsonschema>=4.23"]

training = ["torch>=2.9,<3", "transformers>=4.57,<6", "safetensors>=0.6"]
cluster = ["ray[default,client]>=2.55,<3"]
rollout-gpu = ["vllm>=0.26,<0.27"]
storage = ["boto3>=1.40,<2"]

world-model = ["torch>=2.9,<3", "transformers>=4.57,<6", "safetensors>=0.6", "peft>=0.17,<1"]
